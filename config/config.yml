# Ini adalah file konfigurasi Frigate untuk pemula
mqtt:
  host: 172.17.0.1 # IP Broker Mosquitto Anda
  port: 1883
  # enabled: true # Kita tidak butuh MQTT untuk simulasi


# Pilih NVIDIA GPU (device 0) - RTX 4070 Ti SUPER
detectors:
  tensorrt:
    type: tensorrt
    device: 0  # Wajib jika ada multiple GPU

# ============================================
# Face Recognition Configuration ⭐
# ============================================
face_recognition:
  enabled: true
  # Model size: 'large' untuk GPU (lebih akurat), 'small' untuk CPU
  model_size: large
  recognition_threshold: 0.9
  min_faces: 1
  unknown_score: 0.8
  min_area: 500
  detection_threshold: 0.7
  # Gunakan GPU untuk face recognition
  device: 0  # Pake GPU yang sama

# ============================================
# Optional: GenAI untuk deskripsi tambahan
# ==========================================
genai:
  enabled: false  # Bisa enable jika mau deskripsi AI
  provider: ollama
  model: llava


ffmpeg:
  hwaccel_args: preset-nvidia # Biarkan Frigate otomatis menyesuaikan hardwaremu

cameras:
  video_simulasi_1:
    enabled: true
    ffmpeg:
      inputs:
        - path: /media/frigate/test_video_4.mp4 # Path video di dalam container media\test_video_2.mp4
          input_args: -re -stream_loop -1 -fflags +genpts # Tambahkan ini agar video looping dan real-time
          roles:
            - detect # Frigate akan mendeteksi objek di video
            - record # Frigate akan merekam video
    detect:
      enabled: true # Pastikan ini eksplisit
      width: 1280 # Lebar video (sesuaikan dengan video kamu)
      height: 720 # Tinggi video (sesuaikan dengan video kamu)
      fps: 5 # Jumlah frame per detik (cukup untuk simulasi)

    objects:
      track:
        - person
        - car
        - motorcycle
        - truck
        - face # Tambahkan ini untuk deteksi wajah
    
    snapshots:
      enabled: true # Wajib aktif agar muncul di menu 'Detections'
      timestamp: true
      bounding_box: true
      retain:
        default: 7
    
    record:
      enabled: true
      retain:
        days: 1 # Simpan rekaman selama 1 hari
      # Alerts hanya untuk event dengan sub_label tertentu
      events:
        retain:
          default: 7
          mode: active_objects

