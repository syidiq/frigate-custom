# Ini adalah file konfigurasi Frigate untuk pemula
mqtt:
  host: 172.17.0.1 # IP Broker Mosquitto Anda
  port: 1883
  topic_prefix: frigate

  # enabled: true # Kita tidak butuh MQTT untuk simulasi

# detectors:
#   ov:
#     type: openvino
#     device: GPU # or NPU

# model:
#   model_type: yolo-generic
#   width: 320 # <--- should match the imgsize set during model export
#   height: 320 # <--- should match the imgsize set during model export
#   input_tensor: nchw
#   input_dtype: float
#   path: /config/model_cache/yolo.onnx
#   labelmap_path: /labelmap/coco-80.txt

detectors:
  cpu:
    type: cpu
    num_threads: 4 # Gunakan 2 core CPU (cukup untuk simulasi)

ffmpeg:
  hwaccel_args: auto # Biarkan Frigate otomatis menyesuaikan hardwaremu

cameras:
  video_simulasi_1:
    enabled: true
    ffmpeg:
      inputs:
        - path: /media/frigate/test_video_4.mp4 # Path video di dalam container media\test_video_2.mp4
          input_args: -re -stream_loop -1 -fflags +genpts # Tambahkan ini agar video looping dan real-time
          roles:
            - detect # Frigate akan mendeteksi objek di video
            - record # Frigate akan merekam video
    detect:
      enabled: true # Pastikan ini eksplisit
      width: 1280 # Lebar video (sesuaikan dengan video kamu)
      height: 720 # Tinggi video (sesuaikan dengan video kamu)
      fps: 5 # Jumlah frame per detik (cukup untuk simulasi)

    objects:
      track:
        - person
        - car
        - motorcycle
        - truck
    
    snapshots:
      enabled: true # Wajib aktif agar muncul di menu 'Detections'
      timestamp: true
      bounding_box: true
      retain:
        default: 7
    
    record:
      enabled: true
      retain:
        days: 1 # Simpan rekaman selama 1 hari
        mode: all
      events:
        retain:
          default: 1
          mode: all # <--- Atau 'all' jika ingin lebih agresif
        draw_objects: true # Agar kotak hijau muncul di hasil rekaman
        draw_zones: true   # Agar area mask/zone muncul di hasil rekaman
    zones:
      zona_restriction:
        coordinates: 0.537,0.359,0.601,0.321,0.617,0.698,0.534,0.738
        loitering_time: 0
    motion:
      mask:
        - 0.013,0.107,0.304,0.097,0.302,0.042,0.01,0.032
        - 0.722,0.873,0.828,0.872,0.841,0.932,0.718,0.94
    review:
      alerts:
        required_zones: zona_restriction
      detections:
        required_zones: zona_restriction

